# Rate-limit only login and OTP verification per client IP; other URIs get an empty key and are not limited.
map $uri $auth_limit_key {
    ~^/v1/auth/(login|verify-login-otp)$ $binary_remote_addr;
    default "";
}
limit_req_zone $auth_limit_key zone=auth:10m rate=2r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    auth_basic "Pharm App";
    auth_basic_user_file /run/secrets/basic_auth_htpasswd;

    location /v1/ {
        limit_req zone=auth burst=6 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;

        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_x_pharm_authorization;
        proxy_set_header X-Pharm-Authorization "";
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"code":429,"message":"Too many requests, please try again later"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
