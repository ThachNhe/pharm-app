name: pharm-app

services:
  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: pharm-frontend-dev
    env_file:
      - ./env/dev/frontend.env
    ports:
      - '${FRONTEND_PORT:-5173}:5173'
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: pharm-backend-dev
    command: sh -c "if [ ! -d node_modules/tsx ]; then npm install --include=dev; fi; exec npm run dev:docker"
    env_file:
      - ./env/dev/backend.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    volumes:
      - ./backend:/usr/src/node-app
      - backend_node_modules:/usr/src/node-app/node_modules
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: pharm-db-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: pharm-mailhog-dev
    ports:
      - '${MAILHOG_PORT:-8025}:8025'
      - '1025:1025'
    restart: unless-stopped

  test-db:
    image: postgres:16-alpine
    profiles: [ test ]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: pharmdb_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U test -d pharmdb_test' ]
      interval: 2s
      timeout: 5s
      retries: 15

  backend-test:
    build:
      context: ./backend
    profiles: [ test ]
    command: npm test
    env_file:
      - ./env/dev/backend.env
    environment:
      DATABASE_URL: postgresql://test:test@test-db:5432/pharmdb_test
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  frontend_node_modules:
  backend_node_modules:
