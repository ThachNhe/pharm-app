services:
  backend:
    container_name: backend-test
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/pharmdb_test
    ports: !reset []
    volumes: !reset []
    command: npm test

  postgres:
    container_name: pharm-postgres-test-db
    environment:
      POSTGRES_DB: pharmdb_test
    ports: !reset []
    volumes: !reset
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_test_data:
