<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/brand-mark.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2E4F32" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap&subset=vietnamese"
    rel="stylesheet" />
  <meta name="description" content="PharmApp — phần mềm quản lý nhà thuốc, tồn kho và bán hàng." />
  <title>PharmApp — Quản lý nhà thuốc</title>
  <script>
    // Apply the saved theme before first paint; ThemeBootstrap keeps it in sync afterwards.
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('ui-storage') || '{}');
        var state = saved.version === 1 && saved.state ? saved.state : {};
        var dark = state.theme === 'dark' ||
          (state.theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.dataset.palette = state.palette === 'blue' ? 'blue' : 'green';
      } catch (error) {
        document.documentElement.dataset.palette = 'green';
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
